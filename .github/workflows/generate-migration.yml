name: Generate Database Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate database connection
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python -c "
          import os
          url = os.environ.get('DATABASE_URL', '')
          if not url:
              raise SystemExit('ERROR: NEON_DATABASE_URL secret is missing.')
          if not url.startswith(('postgresql://', 'postgresql+psycopg://')):
              raise SystemExit('ERROR: Expected a PostgreSQL connection URL.')
          print('Database connection secret is configured.')
          "

      - name: Generate migration
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          FLASK_APP: app:create_app
        run: |
          flask db migrate -m "Add scripture content"

      - name: Save migration to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add migrations/versions/

          if git diff --cached --quiet; then
            echo "No new migration file was generated."
          else
            git commit -m "Add scripture content database migration"
            git push
          fi
