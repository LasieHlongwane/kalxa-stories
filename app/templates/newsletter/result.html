{% extends 'base.html' %}
{% block title %}{{ title }} | KALXA Stories{% endblock %}
{% block content %}
<section class="page-container" style="max-width:700px;padding:110px 0;">
 <span class="hero-label">KALXA STORIES</span>
 <h1 style="font-family:var(--kalxa-serif);font-size:clamp(38px,6vw,65px)">{{ title }}</h1>
 <p style="line-height:1.8;color:var(--kalxa-text-soft)">{{ message }}</p>
 <a class="read-link" href="{{ url_for('public.home') }}">Back to stories →</a>
</section>
{% endblock %}
