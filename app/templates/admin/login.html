<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Kalxa Stories | Admin Login
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            margin: 0;

            padding: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #111318;

            color: #17191d;

        }


        .login-card {

            width: min(
                430px,
                100%
            );

            padding:
                40px
                34px;

            border-radius: 22px;

            background: white;

        }


        .eyebrow {

            margin-bottom: 8px;

            color: #777c84;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 1.5px;

        }


        h1 {

            margin:
                0
                0
                8px;

            font-size: 31px;

            letter-spacing: -1px;

        }


        .intro {

            margin:
                0
                0
                30px;

            color: #717680;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 800;

        }


        input {

            width: 100%;

            height: 48px;

            margin-bottom: 20px;

            padding:
                0
                13px;

            border:
                1px solid
                #d7dade;

            border-radius: 10px;

            outline: none;

        }


        input:focus {

            border-color: #111318;

        }


        button {

            width: 100%;

            min-height: 48px;

            border: 0;

            border-radius: 10px;

            background: #111318;

            color: white;

            font-weight: 900;

            cursor: pointer;

        }


        .flash {

            margin-bottom: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #ffe6e6;

            color: #842626;

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="login-card">


    <div class="eyebrow">
        KALXA
    </div>


    <h1>
        Stories Control Centre
    </h1>


    <p class="intro">
        Sign in to manage restaurant stories.
    </p>


    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% for category, message
            in messages
        %}

            <div class="flash">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST">


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            autocomplete="username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            Enter Control Centre
        </button>


    </form>


</div>


</body>

</html>
